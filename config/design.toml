# THE DESIGN: the analyst's choices (calibration, Monte Carlo, foils, checks).
#
# Everything here is EXOGENOUS: we choose it before any run. Nothing in this
# file is computed by the model. Endogenous quantities live only in
# data/planted.json and results/. Loaded by src/poc_abm/config.py.

[monte_carlo]
reps_estimand = 200              # reps per arm for theta(c) and delta_spill(c)
reps_moment = 30                 # reps per arm for M(c)
reps_z = 200                     # z := M-hat(c*) (scripts/plant_z.py); was tied to reps_estimand, keep them in step
# Simulation noise and assignment streams are not seeded here: they use
# kernel.stream_seed(label, rep) = crc32 of a length-prefixed key.

[history_matching]
waves = 3
wave_points = 1000               # Latin-hypercube points per wave
box_inflation = 0.20             # next-wave box = NROY bounding box, span widened 20% (10% per side)
singleton_span_fraction = 0.05   # F-SINGLETON flag: every NROY axis span < 5% of the box span
confidence = 0.95                # tau = chi2 quantile (df = number of moments); also the CI level of both foils
seed = 20260814                  # one Generator for all wave designs

# Discrepancy delta, same units as z (levels on [0, 1]; correlation unitless).
# The order of the rows is the order of the moments.
[history_matching.delta]
sq_level = 0.02
sq_corr_x1 = 0.05
sq_peer_corr = 0.05
pilot_level = 0.02

[image]
theta_sample = 400               # NROY points sampled for the images
seed = 20260815                  # sample of the 400 points; was history_matching.seed + 1, keep them in step
# Endpoint recheck: fresh reps_estimand reps on stream offsets 100000, 100001, ...
# Disjoint from the image reps (0..199), the foil panel (0) and the Foil 2 gate (1,000,000+).
recheck_offset = 100_000

[foils]
panel_offset = 0                 # the one panel each foil sees (rep offset for stream_seed)
exposure_share_cut = 0.25        # Foil 2 strata: S0b vs S0c
stratum_min_n = 20               # merge S0b into S0c if any cell is thinner (decided per panel)
exposure_mc_draws = 10_000       # Foil 2 variance: simulated random-arm assignments
exposure_mc_seed = 20260817

# Amendment A2: fresh repeated-panel block for the three theta2 analysts.
[interference]
repetitions = 200
offset_base = 2_000_000
design_redraws = 400
design_offset_base = 3_000_000

# scripts/check_foil2_coverage.py (declared before its first run; PLAN item 11)
[foil2_check]
kernel_panels = 200              # R: kernel panels per point (reported result)
design_redraws = 300             # R_design: assignment-only redraws per point (reported result)
gate_assignments = 10_000        # R_gate: map-consistent assignments for the gate
gate_seed = 1_000_000            # fresh seed block
gate_effect_s1 = 0.05            # gate outcomes: y = b + 0.05 * 1{S1} + 0.03 * 1{S0c}
gate_effect_s0c = 0.03           # so the true spillover is exactly 0.03
bootstrap_reps = 1_000
bootstrap_seed = 20261020


